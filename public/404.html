<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found (404) | Sahitya Kashyap</title>
    <meta name="description" content="The requested page could not be found. Return to the industrial design portfolio of Sahitya Kashyap." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #090c10;
        color: #e5e5e5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 520px;
        width: 100%;
        padding: 48px 32px;
        background: #12161f;
        border: 1px solid #262c36;
        border-radius: 20px;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        background: #1c2333;
        color: #f07200;
        border-radius: 9999px;
        font-family: monospace;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 72px;
        font-weight: 500;
        font-family: monospace;
        color: #ffffff;
        margin-bottom: 8px;
        line-height: 1;
      }
      h2 {
        font-size: 22px;
        font-weight: 500;
        color: #e5e5e5;
        margin-bottom: 12px;
      }
      p {
        font-size: 14px;
        color: #8b949e;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-block;
        background: #ffffff;
        color: #090c10;
        padding: 12px 28px;
        border-radius: 9999px;
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
        font-family: monospace;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Error 404 // Coordinate Out of Bounds</div>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The requested page, CAD model, or project coordinate does not exist or has been relocated.</p>
      <a href="/" class="btn">Return to Homepage</a>
    </div>
  </body>
</html>
